version: "3.8"
volumes:
  mongo-data: {}
  redis-data: {}
  typesense-data: {}

networks:
  jikan_network: {}
  # shared with the Cloudflare tunnel so jikan_rest is reachable via cloudflared
  dokploy-network:
    external: true

secrets:
  db_username:
    file: db_username.txt
  db_password:
    file: db_password.txt
  db_admin_username:
    file: db_admin_username.txt
  db_admin_password:
    file: db_admin_password.txt
  redis_password:
    file: redis_password.txt
  typesense_api_key:
    file: typesense_api_key.txt

services:
  jikan_rest:
    image: "docker.io/jikanme/jikan-rest:${_JIKAN_API_VERSION:-latest}"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    networks:
      - jikan_network
      - dokploy-network
    secrets:
      - db_username
      - db_password
      - typesense_api_key
      - redis_password
    environment:
      PS1: '\[\033[1;32m\]\[\033[1;36m\][\u@\h] \[\033[1;34m\]\w\[\033[0;35m\] \[\033[1;36m\]# \[\033[0m\]'
    env_file:
      - ./docker/config/.env.compose
    volumes:
      # Bind-mount the corrected entrypoint so the deployed container (official image)
      # never forces a broken SCOUT_DRIVER into /app/.env (the upstream loop wrote SCOUT_DRIVER=
      # on every iteration, which enabled Scout with an invalid driver and 500'd every endpoint).
      - ./docker-entrypoint.php:/app/docker-entrypoint.php:ro
      # Search index schema fixes: this compose has no `build:` section, so the app code is the
      # one baked into jikanme/jikan-rest:latest. Mounting a file is how app code reaches
      # production here (same mechanism as docker-entrypoint.php above) and keeps the change
      # revertible: removing the line restores the file shipped with the image.
      # Without them Typesense rejects query_by/sort_by on undeclared fields as long as the
      # collection is empty (the dynamic `.*` field never materializes), so /v4/*?q= returns 500.
      - ./app/JikanApiSearchableModel.php:/app/app/JikanApiSearchableModel.php:ro
      - ./app/Anime.php:/app/app/Anime.php:ro
      - ./app/Manga.php:/app/app/Manga.php:ro
      - ./app/Person.php:/app/app/Person.php:ro
    ports:
      - "8081:8080/tcp"
    hostname: jikan-rest-api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget --spider -q "http://127.0.0.1:2114/health?plugin=http"',
        ]
      interval: 2s
      timeout: 2s
    links:
      - mongodb:mongodb
      - redis:redis
      - typesense:typesense
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      typesense: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 300M

  mongodb:
    image: docker.io/mongo:focal
    hostname: mongodb
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - 27017/tcp
    command: "--wiredTigerCacheSizeGB ${MONGO_CACHE_SIZE_GB:-0.25}"
    networks:
      - jikan_network
    secrets:
      - db_username
      - db_password
      - db_admin_username
      - db_admin_password
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_admin_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_admin_password
      MONGO_INITDB_DATABASE: jikan_admin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh mongodb://localhost:27017 --quiet --eval "db.runCommand(\"ping\").ok"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M

  redis:
    image: docker.io/redis:6-alpine
    hostname: redis
    secrets:
      - redis_password
    networks:
      - jikan_network
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data:rw
    ports:
      - "6379/tcp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG',
        ]
      interval: 500ms
      timeout: 1s
    deploy:
      resources:
        limits:
          memory: 150M

  typesense:
    # 30.2-arm64-lg-page16: the stock 0.24.1 build aborts on this Pi (ExitCode 134,
    # "<jemalloc>: Unsupported system page size") because the kernel uses 16 KB pages.
    # Pin the exact "-lg-page16" tag: the multi-arch "30.2" tag resolves to the 4 KB arm64 build.
    image: docker.io/typesense/typesense:30.2-arm64-lg-page16
    hostname: typesense
    entrypoint: /bin/sh
    secrets:
      - typesense_api_key
    networks:
      - jikan_network
    command:
      - -c
      # exec => typesense-server becomes PID 1 and receives SIGTERM for graceful shutdown
      - TYPESENSE_API_KEY="$$(cat /run/secrets/typesense_api_key)" exec /opt/typesense-server --data-dir /data
    healthcheck:
      # the image ships neither wget nor curl, only bash -> probe the port with /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
        delay: 5s
      resources:
        limits:
          memory: 512M
    volumes:
      - typesense-data:/data
    ports:
      - "8108/tcp"
